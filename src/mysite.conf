<!-- Images are served from jsDelivr (see Makefile). If the CDN fails, fall back to this site. -->
<script type="text/javascript">
var CDN = "https://cdn.jsdelivr.net/gh/mjdousti/mjdousti.github.io@master";
document.addEventListener("error", function (e) {
  var img = e.target;
  if (img.tagName === "IMG" && img.src.indexOf(CDN) === 0) {
    img.src = img.src.slice(CDN.length);
  }
}, true);
</script>

